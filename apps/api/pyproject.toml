[project]
name = "mygolfviz-api"
version = "0.1.0"
description = "MyGolfViz local app backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2",
    "alembic",
    "pydantic>=2",
    "python-multipart",
    "platformdirs",
    "filelock",
]

[project.scripts]
mygolfviz-api = "mygolfviz_api.__main__:main"

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mygolfviz_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with:Warning"]
