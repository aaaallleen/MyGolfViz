name: CI

# Runs the public check suite and the Local App suite on every pull request, so problems show up before merge.
# Pushes to main are covered by pages.yml, which runs the public suite before it deploys.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # These jobs never launch Electron, so skip its binary download.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # typecheck, vitest, public build, verify:public (forbidden strings), Playwright e2e
      - run: npm run ci:public
      - name: Upload e2e screenshots and failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  local:
    name: Local App - backend tests, local build, local e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # These jobs never launch Electron, so skip its binary download.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # pytest, local build, verify:local, Playwright e2e against the real backend on a fresh data folder
      - run: npm run ci:local
      - name: Upload local e2e screenshots and failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-local
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  desktop:
    name: Mac App - build and packaged e2e
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: npm ci
      # The packaged-app tests drive Electron itself through Playwright, so no browser download is needed.
      # Build the web app, the PyInstaller backend and the unsigned .dmg
      - run: npm run desktop:dist
      # Launch the packaged MyGolfViz.app with a fresh data folder
      - run: npm run e2e:desktop:packaged
      - name: Upload failure traces and the built .dmg
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-results
          path: |
            test-results/
            apps/desktop/release/*.dmg
          retention-days: 7
          if-no-files-found: ignore
