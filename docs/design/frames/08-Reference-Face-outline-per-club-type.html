<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Face outlines by club type</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0D1210}
</style>
</helmet>
<div style="width: 1440px; height: 560px; box-sizing: border-box; padding: 40px; background: #0D1210; color: #EAF0EC; font-family: Inter, system-ui, sans-serif; font-size: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">

<div style="background: #151C19; border: 1px solid #26312C; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600">Driver</h2>
<span style="color: #9BA9A1">Shown for Driver shots</span>
</div>
<svg role="img" aria-label="Driver face outline, face-on, with centre lines and a 20 millimetre grid" viewBox="0 0 400 300" style="width: 100%; height: auto; display: block">
<rect x="0" y="0" width="400" height="300" rx="8" fill="#101714"></rect>
<path d="M45 150 C45 95 90 66 200 62 C310 66 358 96 360 150 C358 205 300 236 200 238 C100 236 45 205 45 150 Z" fill="#1B2420" stroke="#EAF0EC" stroke-width="2"></path>
<g stroke="#3A4740" stroke-width="1">
<line x1="140" y1="72" x2="140" y2="228"></line>
<line x1="260" y1="72" x2="260" y2="228"></line>
<line x1="80" y1="120" x2="330" y2="120"></line>
<line x1="80" y1="180" x2="330" y2="180"></line>
</g>
<line x1="200" y1="62" x2="200" y2="238" stroke="#9BA9A1" stroke-width="1.5" stroke-dasharray="5 5"></line>
<line x1="45" y1="150" x2="360" y2="150" stroke="#9BA9A1" stroke-width="1.5" stroke-dasharray="5 5"></line>
<text x="52" y="276" fill="#9BA9A1" font-size="12" font-family="Inter, sans-serif">Toe</text>
<text x="326" y="276" fill="#9BA9A1" font-size="12" font-family="Inter, sans-serif">Heel</text>
</svg>
</div>

<div style="background: #151C19; border: 1px solid #26312C; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600">Wood / hybrid</h2>
<span style="color: #9BA9A1">Shown for fairway woods and hybrids</span>
</div>
<svg role="img" aria-label="Fairway wood and hybrid face outline, face-on, shallower than the driver, with short score lines at toe and heel" viewBox="0 0 400 300" style="width: 100%; height: auto; display: block">
<rect x="0" y="0" width="400" height="300" rx="8" fill="#101714"></rect>
<path d="M60 150 C60 112 100 96 200 94 C300 96 342 114 344 150 C342 186 296 204 200 206 C104 204 60 188 60 150 Z" fill="#1B2420" stroke="#EAF0EC" stroke-width="2"></path>
<g stroke="#3A4740" stroke-width="1.5">
<line x1="92" y1="130" x2="150" y2="130"></line>
<line x1="92" y1="170" x2="150" y2="170"></line>
<line x1="250" y1="130" x2="310" y2="130"></line>
<line x1="250" y1="170" x2="310" y2="170"></line>
</g>
<line x1="200" y1="94" x2="200" y2="206" stroke="#9BA9A1" stroke-width="1.5" stroke-dasharray="5 5"></line>
<line x1="60" y1="150" x2="344" y2="150" stroke="#9BA9A1" stroke-width="1.5" stroke-dasharray="5 5"></line>
<text x="52" y="276" fill="#9BA9A1" font-size="12" font-family="Inter, sans-serif">Toe</text>
<text x="326" y="276" fill="#9BA9A1" font-size="12" font-family="Inter, sans-serif">Heel</text>
</svg>
</div>

<div style="background: #151C19; border: 1px solid #26312C; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600">Iron</h2>
<span style="color: #9BA9A1">Shown for irons and wedges</span>
</div>
<svg role="img" aria-label="Iron face outline, face-on, with grooves and the hosel at the heel" viewBox="0 0 400 300" style="width: 100%; height: auto; display: block">
<rect x="0" y="0" width="400" height="300" rx="8" fill="#101714"></rect>
<line x1="328" y1="128" x2="366" y2="26" stroke="#EAF0EC" stroke-width="9" stroke-linecap="round"></line>
<path d="M60 215 L50 95 C52 70 85 62 110 70 L320 120 C335 124 340 140 336 160 L328 215 C326 228 315 232 300 232 L85 232 C70 232 62 226 60 215 Z" fill="#1B2420" stroke="#EAF0EC" stroke-width="2" stroke-linejoin="round"></path>
<g stroke="#3A4740" stroke-width="1.5">
<line x1="100" y1="125" x2="310" y2="125"></line>
<line x1="100" y1="140" x2="310" y2="140"></line>
<line x1="100" y1="155" x2="310" y2="155"></line>
<line x1="100" y1="170" x2="310" y2="170"></line>
<line x1="100" y1="185" x2="310" y2="185"></line>
<line x1="100" y1="200" x2="310" y2="200"></line>
<line x1="100" y1="215" x2="310" y2="215"></line>
</g>
<line x1="205" y1="96" x2="205" y2="232" stroke="#9BA9A1" stroke-width="1.5" stroke-dasharray="5 5"></line>
<line x1="56" y1="165" x2="335" y2="165" stroke="#9BA9A1" stroke-width="1.5" stroke-dasharray="5 5"></line>
<text x="52" y="276" fill="#9BA9A1" font-size="12" font-family="Inter, sans-serif">Toe</text>
<text x="326" y="276" fill="#9BA9A1" font-size="12" font-family="Inter, sans-serif">Heel</text>
</svg>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:560}}">
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>


</body></html>
